services:
  db:
    image: postgres:17.6-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: velnaura
      POSTGRES_PASSWORD: velnaura_local_only
      POSTGRES_DB: velnaura
    ports:
      - "127.0.0.1:5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U velnaura -d velnaura"]
      interval: 3s
      timeout: 3s
      retries: 20
volumes:
  postgres_data:
